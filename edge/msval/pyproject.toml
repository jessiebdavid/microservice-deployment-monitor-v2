[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msval"
version = "0.1.0"
description = "Microservices architecture and deployment validation CLI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10"
]

[project.scripts]
msval = "msval_edge.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]